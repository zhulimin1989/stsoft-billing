name: Capability Axis Freeze

on:
  pull_request:
  push:
    branches:
      - main
      - test

permissions:
  contents: read

jobs:
  check:
    name: Check capability axis freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-capability-axis-freeze.mjs
