name: Docker Images

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag to publish in addition to test-latest"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: raytone-lab
  IMAGE_TAG: ${{ inputs.tag || github.sha }}

jobs:
  build:
    name: Build and publish billing images
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: billing_ledger_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing_ledger_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres18:
        # Match the Beijing nprod database exactly for the failed-migration
        # recovery rehearsal. Major-version drift must fail closed in SQL.
        image: postgres:18.3
        env:
          POSTGRES_DB: billing_ledger_ci_pg18
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d billing_ledger_ci_pg18"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Check Publisher contracts package
        run: pnpm publisher:check-contracts

      - name: Check capability axis freeze
        run: pnpm capability-axis-freeze:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify Partner OpenAPI contract
        run: pnpm openapi:check

      - name: Build and verify runtime artifacts
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Apply billing Release A migrations for financial integration tests
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_ledger_ci
        run: pnpm --filter @ruidong/api prisma:migrate:billing

      - name: Apply and verify billing Release B greenfield contract
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_ledger_ci
        run: |
          pnpm --filter @ruidong/api exec prisma db execute \
            --file prisma/rollouts/20260717000100_balance_expiry_v2_contract/migration.sql \
            --url "$BILLING_DATABASE_URL"

          pnpm --filter @ruidong/api exec prisma db execute \
            --file prisma/rollouts/20260717000100_balance_expiry_v2_contract/verify.sql \
            --url "$BILLING_DATABASE_URL"

      - name: Test billing financial ledger against PostgreSQL and Redis
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_ledger_ci
          TEST_DATABASE_NAME: billing_ledger_ci
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm --filter @ruidong/api test:balance-ledger:integration

      - name: Rehearse PostgreSQL 18 failed-migration recovery
        env:
          CI: "true"
          BILLING_PG18_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres
          BILLING_PG18_RECOVERY_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/billing_ledger_recovery_ci_pg18
        run: pnpm --filter @ruidong/api test:balance-ledger:pg18-recovery

      - name: Apply billing Release A migrations on PostgreSQL 18
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/billing_ledger_ci_pg18
        run: pnpm --filter @ruidong/api prisma:migrate:billing

      - name: Apply and verify billing Release B on PostgreSQL 18
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/billing_ledger_ci_pg18
        run: |
          pnpm --filter @ruidong/api exec prisma db execute \
            --file prisma/rollouts/20260717000100_balance_expiry_v2_contract/migration.sql \
            --url "$BILLING_DATABASE_URL"

          pnpm --filter @ruidong/api exec prisma db execute \
            --file prisma/rollouts/20260717000100_balance_expiry_v2_contract/verify.sql \
            --url "$BILLING_DATABASE_URL"

      - name: Test billing financial ledger on PostgreSQL 18
        env:
          BILLING_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/billing_ledger_ci_pg18
          TEST_DATABASE_NAME: billing_ledger_ci_pg18
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm --filter @ruidong/api test:balance-ledger:integration

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build billing-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha,scope=billing-api
          cache-to: type=gha,mode=max,scope=billing-api
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-billing-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-billing-api:test-latest

      - name: Build billing patch artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.patch
          push: true
          build-args: |
            SOURCE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-billing-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=billing-patch
          cache-to: type=gha,mode=max,scope=billing-patch
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-billing-patch:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/codesphere-billing-patch:test-latest
          secrets: |
            github_token=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
